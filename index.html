<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Finance App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
    }

    .card {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      max-width: 720px;
      width: 100%;
    }

    h2 {
      text-align: center;
      margin: 0 0 1.5rem;
      font-weight: 600;
      color: #333;
    }

    h3 { margin: 1rem 0 0.5rem; color: #333; }

    form { display: flex; flex-direction: column; }

    textarea {
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 1rem;
      resize: vertical;
      min-height: 100px;
      transition: 0.2s ease;
    }

    textarea:focus {
      border-color: #4f46e5;
      outline: none;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    button.primary {
      padding: 0.75rem;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button.primary:hover:not(:disabled) { background: #4338ca; }
    button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
    button:focus-visible { outline: 3px solid rgba(79, 70, 229, 0.4); outline-offset: 2px; }

    #result {
      margin-top: 1rem;
      background: #eef2ff;
      padding: 1rem;
      border-radius: 8px;
      color: #1e3a8a;
      min-height: 1.5rem;
      white-space: pre-wrap;
    }

    .icon-row {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .icon { font-size: 2rem; }

    /* --- preview table --- */
    .tableWrap { overflow-x: auto; margin-bottom: 1rem; }

    #previewTable {
      width: 100%;
      border-collapse: collapse;
    }
    #previewTable th,
    #previewTable td {
      border: 1px solid #ddd;
      padding: 6px 8px;
      font-size: 0.9rem;
      text-align: left;
      vertical-align: top;
    }
    #previewTable th { background: #f3f4f6; font-weight: 600; white-space: nowrap; }
    #previewTable td.num { text-align: right; white-space: nowrap; }
    #previewTable td.action,
    #previewTable th.action { width: 44px; text-align: center; }

    #previewTable .del {
      background: transparent;
      border: 1px solid #000;
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    #previewTable tr.failed td { background: #fee; color: #b00; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Personal Finance App</h2>
    <div class="icon-row" aria-hidden="true">
      <span class="icon">🐷</span>
      <span class="icon">🦄</span>
      <span class="icon">🍉</span>
    </div>

    <form id="myForm">
      <textarea id="messageInput" placeholder="Type your message... (one entry per line)" required></textarea>
      <button type="submit" id="submitBtn" class="primary">Submit</button>
    </form>

    <p id="result" role="status" aria-live="polite"></p>

    <div id="previewBox" hidden>
      <h3>Preview</h3>
      <div class="tableWrap">
        <table id="previewTable"></table>
      </div>
      <button type="button" id="confirmBtn" class="primary">✅ Save to Sheet</button>
    </div>
  </div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx-2O7OlENzfhEml8RaxOWPVo6w_q7mBNUW50m_bsMd-CE4zga2crwpjVvrbRop90io/exec';

const form       = document.getElementById('myForm');
const input      = document.getElementById('messageInput');
const submitBtn  = document.getElementById('submitBtn');
const previewBox = document.getElementById('previewBox');
const previewTbl = document.getElementById('previewTable');
const confirmBtn = document.getElementById('confirmBtn');
const resultBox  = document.getElementById('result');

let lastPreview = [];   // parsed objects from the preview step

/* ---------- HELPERS ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

function getToken() {
  try {
    let t = localStorage.getItem('fin_token');
    if (!t) {
      t = prompt('Passphrase?') || '';
      if (t) localStorage.setItem('fin_token', t);
    }
    return t;
  } catch (_) {
    return prompt('Passphrase?') || '';
  }
}

function clearToken() {
  try { localStorage.removeItem('fin_token'); } catch (_) {}
}

async function fetchJSON(payload, mode = '') {
  try {
    const r = await fetch(SCRIPT_URL + (mode ? `?mode=${mode}` : ''), {
      method : 'POST',
      headers: { 'Content-Type': 'text/plain' },   // avoids CORS preflight
      body   : JSON.stringify({ token: getToken(), ...payload })
    });
    const data = await r.json();
    if (data.error === 'Unauthorized') clearToken();
    return data;
  } catch (err) {
    return { error: String(err) };
  }
}

function showError(msg) {
  resultBox.textContent = '❌ ' + msg;
  previewBox.hidden = true;
}

/* ---------- STEP 1: PREVIEW ---------- */
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const rawText = input.value.trim();
  if (!rawText) return;

  submitBtn.disabled = true;
  resultBox.textContent = '⏳ Analyzing…';
  previewBox.hidden = true;

  const data = await fetchJSON({ message: rawText }, 'preview');
  submitBtn.disabled = false;

  if (data.error) return showError(data.error);

  lastPreview = data.preview || [];
  buildPreviewTable(lastPreview, data.failed || []);

  if (lastPreview.length) {
    resultBox.textContent = '👀 Delete any rows you dislike, then click Save.';
  } else {
    resultBox.textContent = '❌ No line could be parsed. Check the rows below and try again.';
  }
  confirmBtn.hidden = !lastPreview.length;
  previewBox.hidden = false;
});

/* ---------- STEP 2: COMMIT (sends the previewed rows, no second AI call) ---------- */
confirmBtn.addEventListener('click', async () => {
  const keep = [...previewTbl.querySelectorAll('tr[data-i]')]
    .map(tr => lastPreview[Number(tr.dataset.i)])
    .filter(Boolean);

  if (!keep.length) return showError('Nothing to save!');

  confirmBtn.disabled = true;
  resultBox.textContent = '⏳ Saving…';

  const data = await fetchJSON({ entries: keep });
  confirmBtn.disabled = false;

  if (data.error) return showError(data.error);

  resultBox.textContent =
    `✅ ${data.inserted} rows added` +
    ((data.failed || []).length ? `, ❌ ${data.failed.length} failed` : '');
  previewBox.hidden = true;
  lastPreview = [];
  form.reset();
});

/* ---------- BUILD PREVIEW TABLE ---------- */
function buildPreviewTable(rows, failed) {
  const header = ['raw', 'who', 'date', 'amount', 'flow', 'purpose'];

  let html = `<tr>${header.map(h => `<th>${h}</th>`).join('')}<th class="action"></th></tr>`;

  rows.forEach((obj, i) => {
    const amount = Number(obj.amount);
    html += `
      <tr data-i="${i}">
        <td>${esc(obj.raw)}</td>
        <td>${esc(obj.who)}</td>
        <td>${esc(obj.date)}</td>
        <td class="num">${Number.isFinite(amount) ? amount.toLocaleString('vi-VN') : esc(obj.amount)}</td>
        <td>${esc(obj.flow)}</td>
        <td>${esc(obj.purpose)}</td>
        <td class="action">
          <button type="button" class="del" aria-label="Delete row">❌</button>
        </td>
      </tr>`;
  });

  failed.forEach(({ raw, reason }) => {
    html += `<tr class="failed"><td colspan="7">❌ ${esc(raw)} — ${esc(reason)}</td></tr>`;
  });

  previewTbl.innerHTML = html;
}

/* one listener for all delete buttons (survives re-renders) */
previewTbl.addEventListener('click', (e) => {
  const btn = e.target.closest('button.del');
  if (btn) btn.closest('tr').remove();
});
</script>
</body>
</html>
